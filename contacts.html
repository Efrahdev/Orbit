@font-face{font-family:"Noto Sans";src:url(./noto-sans.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* Quiet, readable list: neutral surfaces, one muted violet accent, thin borders, soft gradients only on avatars and the main button. */
:root{--read:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--bar-h:116px;--ease:cubic-bezier(.2,.7,.3,1)}

body[data-theme="light"]{--bg:#f4f5f8;--surface:#ffffff;--surface2:#f0f2f6;--field:#ffffff;--line:rgba(16,24,40,.08);--line2:rgba(16,24,40,.14);--text:#151922;--muted:#5c6474;--faint:#949bab;--accent:#5b4bd6;--accent-bg:rgba(91,75,214,.09);--danger:#c8314f;--danger-bg:rgba(200,49,79,.08);--ok:#11866f;--warn:#a26a00;
  --call:#11866f;--call-bg:rgba(17,134,111,.09);--sms:#2f5fd0;--sms-bg:rgba(47,95,208,.08);--wa:#1f8a43;--wa-bg:rgba(31,138,67,.09);--glass:rgba(244,245,248,.9);--press:rgba(16,24,40,.035);--sel:rgba(91,75,214,.07)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg,#0b0d12)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--read);-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:15px;line-height:1.45}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.row{content-visibility:auto;contain-intrinsic-size:auto 64px;position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"av name quick" "av sub acts";column-gap:12px;row-gap:1px;align-items:center;padding:9px 8px 9px 12px;min-height:64px;cursor:pointer;outline:0;transition:background .15s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:14.5px;font-weight:600;color:var(--text);text-decoration:none;transition:background .15s}
.btn:active{background:var(--surface2)}

.selbar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:4px;max-width:calc(100vw - 20px);padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 12px 30px -16px rgba(0,0,0,.7)}

/* layers */

.layer{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);-webkit-overflow-scrolling:touch}
.layer[hidden]{display:none}
.layer.anim-in{animation:layer-in .3s var(--ease)}

@keyframes layer-in{from{opacity:0;transform:translateY(24px)}}

html.vt-layer::view-transition-old(root),html.vt-layer::view-transition-new(root){animation:none}
::view-transition-new(layer){animation:layer-in .3s var(--ease)}

::view-transition-old(hero-av),::view-transition-new(hero-av){height:100%;width:100%;animation:none}
.lin{width:min(600px,100%);margin:0 auto;min-height:100%;padding:max(8px,env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.lbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin:0 -14px;padding:8px 14px;background:var(--bg)}

.textbtn{min-height:38px;padding:0 12px;border:0;border-radius:10px;background:none;font-size:15px;font-weight:600;color:var(--muted)}

.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.fhead span{display:flex;align-items:center;gap:7px}

.frow{display:flex;align-items:center;gap:8px;padding:4px 0}

.fin:focus,.frow select:focus,.frow input:focus,.fcard textarea:focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent)}

.fin{width:100%}
.fcard textarea{width:100%;height:auto;min-height:84px;padding:11px 12px;resize:vertical;line-height:1.5}
.rm{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--faint);display:grid;place-items:center}
.addrow{display:inline-flex;align-items:center;gap:6px;min-height:38px;margin-top:2px;padding:0 2px;border:0;background:none;font-size:14px;font-weight:600;color:var(--accent)}
.addrow .i{width:16px;height:16px}
.warn{margin:4px 2px 2px;font-size:12.5px;color:var(--warn);display:none}
.warn.show{display:block}
.flabel{display:block;margin:10px 2px 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tagpick{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0 6px}
.inline{display:flex;gap:8px;padding:4px 0 2px}
.inline input{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:6px 14px;font-size:15px;font-weight:600;cursor:pointer}
.switch input{position:absolute;opacity:0;pointer-events:none}
.sw{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.switch input:checked+.sw{background:var(--accent);border-color:transparent}
.switch input:checked+.sw:after{transform:translateX(18px)}
.switch input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.bigsave{width:100%;margin-top:16px}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{color:var(--text);background:var(--surface);box-shadow:0 0 0 1px var(--line2)}
.statusline{display:flex;align-items:center;gap:12px;padding:6px 2px 8px}
.statusline .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--faint)}
[data-sync="idle"] .statusline .dot{background:var(--ok)}
[data-sync="syncing"] .statusline .dot{background:var(--accent)}
[data-sync="error"] .statusline .dot{background:var(--danger)}
[data-sync="off"] .statusline .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.statusline b{display:block;font-size:15.5px}
.statusline span{display:block;margin-top:1px;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;padding:2px 2px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.note{margin:6px 2px 4px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .lk{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin-top:1px}
.log .lk .i{width:14px;height:14px}
.log .lk.added{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.log .lk.edited,.log .lk.tagged,.log .lk.formatted{color:var(--sms);background:var(--sms-bg)}
.log .lk.deleted{color:var(--danger);background:var(--danger-bg)}
.log .lk.merged,.log .lk.synced{color:var(--accent);background:var(--accent-bg)}
.log .lt{flex:1;min-width:0;font-size:14px}
.log .lt small{display:block;font-size:12px;color:var(--muted)}
.tagrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.tagrow:first-child{border-top:0}
.tagrow .tn{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.tagrow .tn small{margin-left:6px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tagrow input{flex:1;min-width:0}
.tagrow .mi{width:34px;height:34px}
.tagrow .mi.armed{color:var(--danger);background:var(--danger-bg)}
.tcheck{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:15px;font-weight:600}
.tcheck:first-child{border-top:0}
.tcheck .bx{position:relative;flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;color:#fff}
.tcheck .bx svg{position:absolute;width:14px;height:14px;opacity:0}
.tcheck[data-state="all"] .bx{background:var(--accent);border-color:var(--accent)}
.tcheck[data-state="all"] .bx svg.ck{opacity:1}
.tcheck[data-state="some"] .bx{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.tcheck[data-state="some"] .bx svg.dash{opacity:1}
.tcheck .tc{flex:1}
.tcheck small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.dgroup{margin-top:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.dgroup .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dgroup .dr{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 12px;border-top:1px solid var(--line)}
.dgroup .dh+.dr{border-top:0}
.dgroup .dr .k{flex:1;min-width:0}
.dgroup .dr b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgroup .dr .k span{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dgroup .dr .mi{width:34px;height:34px}
.dgroup .dr .mi.armed{color:var(--danger);background:var(--danger-bg)}
.dgroup .df{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.dgroup .df .btn{flex:1}
details.guide summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:46px;font-size:15px;font-weight:600;cursor:pointer}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary:after{content:"+";font-size:20px;color:var(--muted)}
details.guide[open] summary:after{content:"–"}

.sos{border-color:color-mix(in srgb,var(--danger) 30%,var(--line))}

.hold>*{position:relative}

.lockscr h2{margin:18px 0 8px;font-size:22px}

async function moveTag(name,dir){const order=chipOrder(tagCounts(live())).map(t=>t.name);const i=order.findIndex(t=>t.toLowerCase()===name.toLowerCase()),j=i+dir;if(i<0||j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];
  const markers=tagLib.list.filter(t=>t[0]==='!'||t.includes('=>'));const others=libPlain().filter(t=>!order.some(o=>o.toLowerCase()===t.toLowerCase()));
  await setLib([...order,...others,...markers]);render();drawTagMgr();haptic(5)}
function renderChips(cs){
  const tags=tagCounts(cs),starN=cs.filter(c=>c.fav).length;
  for(const t of [...activeTags])if(!tags.some(x=>x.name.toLowerCase()===t))activeTags.delete(t);
  if(starOnly&&!starN)starOnly=false;
  const none=!starOnly&&!activeTags.size;
  const shown=chipOrder(tags);
  let h=`<button class="chip ${none?'on':''}" data-chip="all">All <small>${cs.length}</small></button>`;
  if(starN)h+=`<button class="chip ${starOnly?'on':''}" data-chip="star">${U('star','cs')}Starred <small>${starN}</small></button>`;
  for(const t of shown)h+=`<button class="chip ${activeTags.has(t.name.toLowerCase())?'on':''}" data-chip="tag" data-tag="${esc(t.name.toLowerCase())}">${esc(t.name)} <small>${t.n}</small></button>`;
  $('#chips').innerHTML=h;
  $('#chips').hidden=!cs.length;
}
function rowHTML(c,ph,d){
  const name=disp(c),sub=ph?context(c,ph):(c.phones[0]?.value||c.emails[0]?.value||'');
  const tel=c.phones[0]?.value;
  const off=tel?'':' off',th=tel?esc(telHref(tel)):'';
  return `<div class="row${d!==undefined?' rise':''}${selected.has(c.id)?' selected':''}"${d!==undefined?` style="--d:${d}"`:''} data-id="${esc(c.id)}" role="button" tabindex="0">`+
    `${av(c)}<span class="chk" aria-hidden="true">${CK}</span>`+
    `<div class="rn">${hl(name,ph)}${c.fav?U('star','star'):''}</div>`+
    `<div class="rq"><button class="mi" data-r="edit" aria-label="Edit">${U('edit')}</button><button class="mi" data-r="copy" aria-label="Copy">${U('copy')}</button></div>`+
    `<div class="rs"><span class="num">${esc(sub)}</span></div>`+
    `<div class="ra"><a class="ic sms${off}" href="${tel?'sms:'+th:'#'}" aria-label="Message">${U('msg')}</a><a class="ic wa${off}" href="${tel?'https://wa.me/'+esc(waNumber(tel)):'#'}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">${U('wa')}</a><a class="ic call${off}" href="${tel?esc(callHref(tel)):'#'}" aria-label="Call">${U('phone')}</a></div>`+
  `</div>`;
}
const letterOf=c=>{const ch=(norm(disp(c)).match(/\p{L}/u)||[''])[0].toUpperCase();return /^[A-Z]$/.test(ch)?ch:'#'};
let groupLetters=[],pendingBlocks=[],renderToken=0;
function flushPending(){if(pendingBlocks.length){list.insertAdjacentHTML('beforeend',pendingBlocks.map(b=>b.html()).join(''));pendingBlocks=[]}}
function pump(token){if(token!==renderToken||!pendingBlocks.length)return;let html='',rows=0;while(pendingBlocks.length&&rows<120){const b=pendingBlocks.shift();html+=b.html();rows+=b.n}list.insertAdjacentHTML('beforeend',html);requestAnimationFrame(()=>pump(token))}
function render(){
  const cs=live();for(const c of cs)indexOf(c);
  renderChips(cs);
  const ph=phraseOf(q);
  let res=cs;
  if(starOnly||activeTags.size)res=res.filter(c=>(starOnly&&c.fav)||effTags(c).some(t=>activeTags.has(t.toLowerCase())));
  const anim=firstPaint&&!reduce;let d=0;const A=()=>anim&&d<14?d++:undefined;
  const blocks=[];groupLetters=[];
  if(ph){
    const scored=[];for(const c of res){const v=matchScore(c,ph);if(v)scored.push([v+(c.fav?3:0),c])}
    scored.sort((a,b)=>b[0]-a[0]||collator.compare(disp(a[1]),disp(b[1])));
    res=scored.map(x=>x[1]);
    const cap=Math.min(res.length,300);
    if(res.length)blocks.push({n:cap,html:()=>`<div class="section-label">${res.length} ${res.length===1?'MATCH':'MATCHES'}${res.length>cap?` · SHOWING ${cap}`:''}</div><div class="gcard">${res.slice(0,cap).map(c=>rowHTML(c,ph,A())).join('')}</div>`});
  }else{
    res=[...res].sort((a,b)=>collator.compare(disp(a),disp(b)));
    const starred=res.filter(c=>c.fav);
    if(starred.length&&!starOnly){blocks.push({n:starred.length,html:()=>`<div class="group" data-letter="★"><div class="gl">★ STARRED</div><div class="gcard">${starred.map(c=>rowHTML(c,'',A())).join('')}</div></div>`});groupLetters.push('★')}
    const groups=new Map();for(const c of res){const L=letterOf(c);if(!groups.has(L))groups.set(L,[]);groups.get(L).push(c)}
    const keys=[...groups.keys()].sort((a,b)=>a==='#'?1:b==='#'?-1:a.localeCompare(b));
    for(const L of keys){const g=groups.get(L);blocks.push({n:g.length,html:()=>`<div class="group" data-letter="${L}"><div class="gl">${L}</div><div class="gcard">${g.map(c=>rowHTML(c,'',A())).join('')}</div></div>`});groupLetters.push(L)}
  }
  lastResults=res;
  renderToken++;
  if(!res.length){list.innerHTML=emptyHTML(cs.length,!!ph);pendingBlocks=[]}
  else{
    // first screen immediately, the rest streamed in on the next frames
    let first='',rows=0;while(blocks.length&&rows<60){const b=blocks.shift();first+=b.html();rows+=b.n}
    list.innerHTML=first;pendingBlocks=blocks;const tk=renderToken;requestAnimationFrame(()=>pump(tk));
  }
  firstPaint=false;
  $('#azBtn').hidden=!!ph||res.length<2;requestAnimationFrame(updateLetter);
  updateMeta();updateSelbar();
}
function emptyHTML(total,searching){
  if(searching){const t=q.trim(),isNum=isNumQ(t);return `<div class="empty"><div class="eic">${sv('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>')}</div><h2>No one matches “${esc(t)}”</h2><p>Search looks for exactly these characters together, in names, tags, numbers, emails and notes.</p><div class="actions"><button class="btn primary" data-act="new-from-q">${I.plus}Add “${esc(t.slice(0,30))}” as ${isNum?'a number':'a contact'}</button></div></div>`}
  if(total)return `<div class="empty"><h2>No contacts with these tags</h2><div class="actions"><button class="btn" data-act="clear-filters">Show everyone</button></div></div>`;
  const picker='contacts' in navigator&&'ContactsManager' in window;
  return `<div class="empty"><div class="eic">${I.users}</div><h2>No contacts yet</h2><p>Add someone, import from your phone, or connect your Google Sheet to bring in everyone you have saved.</p><div class="actions"><button class="btn primary" data-act="new">${I.plus}Add contact</button>${picker?`<button class="btn" data-act="pick">${I.phoneBook}Import from this phone</button>`:''}<button class="btn" data-act="vcf">${I.down}Import .vcf file</button><button class="btn" data-act="settings">${I.sync}${cfg.url?'Sync now':'Connect Google Sheet'}</button></div></div>`;
}

/* ---------- selection & bulk actions ---------- */
function startSelect(){selecting=true;body.classList.add('selecting');closeAZ();$('#selBtn').classList.add('on');updateSelbar()}
function endSelect(){selecting=false;selected.clear();body.classList.remove('selecting');$('#selBtn').classList.remove('on');$$('.row.selected').forEach(r=>r.classList.remove('selected'));updateSelbar()}
function toggleSel(id){selected.has(id)?selected.delete(id):selected.add(id);const r=$(`.row[data-id="${CSS.escape(id)}"]`);if(r)r.classList.toggle('selected',selected.has(id));haptic(4);updateSelbar()}
let delArm=0;
function updateSelbar(){$('#selbar').hidden=!selecting;$('#selCount').textContent=`${selected.size} selected`;const d=$('[data-sb="del"]');if(d&&!delArm){d.classList.remove('armed');$('span',d).textContent='Delete'}}

const pickedContacts=()=>[...selected].map(id=>all.get(id)).filter(c=>c&&!c.deleted);
$('#selbar').addEventListener('click',async e=>{
  const b=e.target.closest('[data-sb]');if(!b)return;const k=b.dataset.sb;
  if(k==='close'){endSelect();return}
  if(k==='all'){const ids=lastResults.map(c=>c.id);const allOn=ids.length&&ids.every(id=>selected.has(id));ids.forEach(id=>allOn?selected.delete(id):selected.add(id));render();return}
  const cs=pickedContacts();if(!cs.length){toast('Select contacts first');return}
  if(k==='tags')openTagSheet();
  else if(k==='star'){const on=!cs.every(c=>c.fav);await saveMany(cs.map(c=>({...c,fav:on})));await logAdd('edited',`${on?'Starred':'Unstarred'} ${cs.length} ${cs.length===1?'contact':'contacts'}`);toast(`${on?'Starred':'Unstarred'} ${cs.length}`);endSelect();render()}
  else if(k==='del'){
    if(!b.classList.contains('armed')){b.classList.add('armed');$('span',b).textContent='Confirm';haptic(15);clearTimeout(delArm);delArm=setTimeout(()=>{delArm=0;updateSelbar()},3000);return}
    clearTimeout(delArm);delArm=0;
    const snap=cs.map(c=>({...c}));await saveMany(cs.map(c=>({...c,deleted:true})));await logAdd('deleted',`Deleted ${cs.length} ${cs.length===1?'contact':'contacts'}`);endSelect();render();
    toast(`Deleted ${cs.length}`,'Undo',async()=>{await saveMany(snap.map(c=>({...c,deleted:false})));await logAdd('added',`Restored ${snap.length} ${snap.length===1?'contact':'contacts'}`)});
  }
});

/* ---------- layers (the Back button closes them) ---------- */
const stack=[];
history.replaceState({depth:0},'');
function animate(el,update,morph,opening){
  const hero=()=>el.querySelector('.hero-av');
  if(document.startViewTransition&&!reduce){
    root.classList.add('vt-layer');el.style.viewTransitionName='layer';
    if(opening&&morph)morph.style.viewTransitionName='hero-av';
    if(!opening&&morph&&hero())hero().style.viewTransitionName='hero-av';
    const cleanup=()=>{root.classList.remove('vt-layer');el.style.viewTransitionName='';const h=hero();if(h)h.style.viewTransitionName='';if(morph)morph.style.viewTransitionName=''};
    let t;
    try{t=document.startViewTransition(()=>{update();if(opening&&morph){morph.style.viewTransitionName='';const h=hero();if(h)h.style.viewTransitionName='hero-av'}if(!opening&&morph)morph.style.viewTransitionName='hero-av'})}
    catch{update();cleanup();return}
    t.finished.then(cleanup,cleanup);t.ready.catch(()=>{});
    return;
  }
  if(opening){update();el.classList.remove('anim-out');el.classList.add('anim-in');setTimeout(()=>el.classList.remove('anim-in'),320)}
  else{el.classList.add('anim-out');setTimeout(()=>{el.classList.remove('anim-out');update()},200)}
}
function openLayer(id,setup,morph){
  const el=$('#'+id);closeAZ();
  if(stack.includes(id)){setup&&setup();return}
  stack.push(id);history.pushState({depth:stack.length,layer:id},'');
  animate(el,()=>{setup&&setup();el.hidden=false;el.scrollTop=0;root.classList.add('layer-open')},morph,true);
}
function hideLayer(id){
  const el=$('#'+id);let morph=null;
  if(id==='detail'&&stack.length===0){const r=$(`.row[data-id="${CSS.escape(detailId||'')}"] .av`);if(r){const b=r.getBoundingClientRect();if(b.bottom>0&&b.top<innerHeight)morph=r}}
  animate(el,()=>{el.hidden=true;if(!stack.length)root.classList.remove('layer-open');if(id==='detail')detailId=null},morph,false);
}
function closeTop(){if(stack.length)history.back()}
addEventListener('popstate',e=>{const depth=e.state?.depth||0;while(stack.length>depth)hideLayer(stack.pop())});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!azPop.hidden)closeAZ();else if(stack.length)closeTop();else if(selecting)endSelect();else if(body.classList.contains('searching'))closeSearch()}});
function refreshOpenLayers(){if(!$('#settings').hidden)paintSettingsLive();if(!$('#dups').hidden)$('#dups').innerHTML=dupsHTML();if(!$('#tagsheet').hidden&&selecting)$('#tagsheet').innerHTML=tagSheetHTML()}

/* ---------- saving ---------- */
async function save(data,{silent=false}={}){
  const c=clean({...data,updatedAt:Date.now(),dirty:true},{format:true});
  const old=all.get(c.id);if(old&&old.createdAt)c.createdAt=old.createdAt;
  all.set(c.id,c);await idb.put([c]);
  dataVer++;
  const kind=!old||old.deleted?(c.deleted?null:'added'):c.deleted?'deleted':'edited';
  if(kind)await logAdd(kind,`${kind==='added'?'Added':kind==='deleted'?'Deleted':'Edited'} ${disp(c)}`,'here',diffLines(old&&!old.deleted?old:null,c.deleted?null:c));
  if(!silent)scheduleRender();
  queueSync(700);
  return c;
}
async function saveMany(items){const now=Date.now();const lines=[];const cs=items.map((d,i)=>{const c=clean({...d,updatedAt:now+i,dirty:true},{format:true});const old=all.get(c.id);if(old&&old.createdAt)c.createdAt=old.createdAt;if(lines.length<200)lines.push(...diffLines(old&&!old.deleted?old:null,c.deleted?null:c,disp(c.deleted&&old?old:c)));return c});lastDiff={t:Date.now(),d:lines};dataVer++;for(const c of cs)all.set(c.id,c);await idb.put(cs);scheduleRender();queueSync(300);return cs}

/* ---------- duplicates ---------- */
let dupIgnore=new Set();
function dupGroups(){
  const cs=live(),parent=new Map(cs.map(c=>[c.id,c.id]));
  const find=x=>{while(parent.get(x)!==x){parent.set(x,parent.get(parent.get(x)));x=parent.get(x)}return x};
  const seen=new Map(),why=new Map(),strong=new Set();
  const add=(k,id,reason)=>{if(k.length<2)return;if(seen.has(k)){const o=seen.get(k);const a=find(o),b=find(id);if(a!==b)parent.set(b,a);if(!why.has(o))why.set(o,reason);if(!why.has(id))why.set(id,reason);if(reason!=='Same name'){strong.add(o);strong.add(id)}}else seen.set(k,id)};
  for(const c of cs){for(const p of c.phones)add('p'+phoneKey(p.value),c.id,'Same number');for(const e of c.emails)add('e'+e.value.trim().toLowerCase(),c.id,'Same email');const n=norm(c.name).replace(/\s+/g,' ').trim();if(n.split(' ').length>=2)add('n'+n,c.id,'Same name')}
  const groups=new Map();for(const c of cs){const r=find(c.id);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(c)}
  return[...groups.values()].filter(g=>g.length>1).map(g=>{g.sort((a,b)=>a.createdAt-b.createdAt);const st=g.some(c=>strong.has(c.id));return{ids:g.map(c=>c.id).sort().join('|'),items:g,strong:st,reason:st?(g.map(c=>why.get(c.id)).find(r=>r&&r!=='Same name')||'Same number'):'Same name only, check before merging'}}).filter(g=>!dupIgnore.has(g.ids)).sort((a,b)=>collator.compare(disp(a.items[0]),disp(b.items[0])));
}
const richness=c=>c.phones.length*3+c.emails.length*2+c.tags.length+(c.name?2:0)+(c.notes?1:0);
const nameWords=n=>norm(n).replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
// The record with the most detail wins. The fullest name is kept (repeated words do not count).
// Every number, email and tag is kept; other names go into the notes as "Also saved as".
function mergeInto(items){
  const primary=[...items].sort((a,b)=>richness(b)-richness(a)||a.createdAt-b.createdAt)[0];
  const others=items.filter(c=>c!==primary);
  const dl=n=>[...new Set(nameWords(n))].join('').length;
  const byName=items.filter(c=>c.name).sort((a,b)=>new Set(nameWords(b.name)).size-new Set(nameWords(a.name)).size||nameWords(a.name).length-nameWords(b.name).length||dl(b.name)-dl(a.name)||(b===primary)-(a===primary));
  const m={...primary};
  m.name=(byName[0]||primary).name.replace(/\s+/g,' ').trim();
  m.phones=[...primary.phones,...others.flatMap(c=>c.phones)];
  m.emails=[...primary.emails,...others.flatMap(c=>c.emails)];
  const tags=[...primary.tags,...others.flatMap(c=>c.tags)];
  const mp=prefixTagOf(m.name);for(const c of items){const pt=prefixTagOf(c.name);if(pt&&(!mp||mp.tag!==pt.tag))tags.push(pt.tag)}
  m.tags=tagList(tags);
  const keep=new Set(nameWords(m.name));
  const aka=[...new Set(items.map(c=>c.name.replace(/\s+/g,' ').trim()).filter(n=>n&&norm(n)!==norm(m.name)&&!nameWords(n).every(w=>keep.has(w))))];
  const notes=[...new Set(items.map(c=>c.notes.trim()).filter(Boolean))];if(aka.length)notes.push('Also saved as: '+aka.join(', '));
  m.notes=notes.join('\n');
  m.fav=items.some(c=>c.fav);
  return{merged:m,others};
}
async function mergeGroups(groups){
  const snaps=[],writes=[];let names=[];
  for(const g of groups){const items=g.items.filter(c=>c&&!c.deleted);if(items.length<2)continue;snaps.push(...items.map(c=>({...c})));const{merged,others}=mergeInto(items);writes.push(merged,...others.map(c=>({...c,deleted:true})));names.push(disp(merged))}
  if(!writes.length)return 0;
  await saveMany(writes);
  await logAdd('merged',names.length===1?`Merged duplicates into ${names[0]}`:`Merged ${names.length} duplicate groups`);
  haptic([8,30,12]);
  toast(names.length===1?`Merged into ${names[0]}`:`Merged ${names.length} duplicate groups`,'Undo',async()=>{await saveMany(snaps);await logAdd('edited',`Undid merge of ${names.length} ${names.length===1?'group':'groups'}`)});
  return names.length;
}
function dupsHTML(){
  const gs=dupGroups(),sg=gs.filter(g=>g.strong).length;
  const inner=gs.length?gs.map(g=>`<div class="dgroup"><div class="dh"><span>${esc(g.reason)} · ${g.items.length} contacts</span><button class="textbtn" style="min-height:32px;font-size:13px" data-dg="ignore" data-ids="${esc(g.ids)}">Not duplicates</button></div>${g.items.map(c=>`<div class="dr">${av(c)}<div class="k"><b>${esc(disp(c))}</b><span>${esc([...c.phones.map(p=>p.value),...c.emails.map(e=>e.value)].join(' · ')||'No number')}</span></div><button class="mi" data-dg="del" data-id="${esc(c.id)}" aria-label="Delete ${esc(disp(c))}">${I.trash}</button></div>`).join('')}<div class="df"><button class="btn sm primary" data-dg="merge" data-ids="${esc(g.ids)}">${I.merge}Merge into one</button></div></div>`).join('')
    :`<div class="empty"><div class="eic">${I.check}</div><h2>No duplicates</h2><p>Every contact has its own numbers and emails.</p></div>`;
  return `<div class="lin"><div class="lbar"><button class="ibtn" data-dg="close" aria-label="Back">${I.back}</button><h2>Duplicates</h2><span style="width:38px"></span></div>${sg?`<button class="btn primary" style="width:100%;margin-top:4px" data-dg="mergeall">${I.merge}Merge all ${sg} with the same number or email</button>`:''}${gs.length?`<p class="note">The contact with the most detail wins and keeps the fullest name. Every number, email and tag is kept, and the other names are saved in the notes. Contacts that only share a name are never merged automatically; merge or delete those one at a time below.</p>`:''}${inner}</div>`;
}
function openDuplicates(){openLayer('dups',()=>{$('#dups').innerHTML=dupsHTML()})}
$('#dups').addEventListener('click',async e=>{
  const b=e.target.closest('[data-dg]');if(!b)return;const k=b.dataset.dg;
  if(k==='close'){closeTop();return}
  if(k==='ignore'){dupIgnore.add(b.dataset.ids);await idb.set('dupIgnore',[...dupIgnore]);$('#dups').innerHTML=dupsHTML();return}
  if(k==='del'){const c=all.get(b.dataset.id);if(!c)return;if(!b.classList.contains('armed')){b.classList.add('armed');haptic(12);setTimeout(()=>b.classList.remove('armed'),2500);return}
    const snap={...c};await save({...c,deleted:true});toast(`Deleted ${disp(c)}`,'Undo',()=>save({...snap,deleted:false}));return}
  if(k==='merge'){const items=b.dataset.ids.split('|').map(id=>all.get(id)).filter(c=>c&&!c.deleted);await mergeGroups([{items}]);return}
  if(k==='mergeall'){await mergeGroups(dupGroups().filter(g=>g.strong));return}

/* ---------- sync engine (Google Apps Script + Sheet) ---------- */
let syncing=false,again=false,syncTimer=0,status='off',statusMsg='',failCount=0;
const wire=c=>({id:c.id,name:c.name,phones:c.phones,emails:c.emails,tags:c.tags,notes:c.notes,fav:c.fav,createdAt:c.createdAt,updatedAt:c.updatedAt,deleted:c.deleted});
function setStatus(s,msg=''){status=s;statusMsg=msg;body.dataset.sync=s;updateMeta();if(!$('#settings').hidden)paintSettingsLive()}
function ago(t){if(!t)return 'never';const s=(Date.now()-t)/1000;if(s<45)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
const pending=()=>{let n=0;for(const c of all.values())if(c.dirty)n++;return n};
function statusText(){const p=pending();if(status==='off')return 'On this phone only';if(status==='syncing')return 'Syncing…';if(status==='offline')return `Offline${p?` · ${p} waiting`:''}`;if(status==='error')return 'Sync paused';return `Synced ${ago(cfg.lastSync)}`}
function updateMeta(){const n=live().length;$('#metaText').textContent=`${n} ${n===1?'person':'people'} · ${statusText()}`}
setInterval(updateMeta,30000);
function queueSync(ms=0){clearTimeout(syncTimer);if(!cfg.url||!cfg.token||cfg.locked)return;syncTimer=setTimeout(()=>sync(),ms)}
async function post(payload,timeout=25000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',signal:ctl.signal,cache:'no-store'});
    const text=await r.text();let j;
    try{j=JSON.parse(text)}catch{throw Error('Google returned a web page instead of data. In Apps Script, deploy as a Web app with “Who has access: Anyone”.')}
    if(!j.ok){const er=Error(j.error||'The sync script reported an error.');er.code=j.code;throw er}
    return j;
  }catch(e){if(e.name==='AbortError')throw Error('Google took too long to answer. Will retry.');throw e}
  finally{clearTimeout(t)}
}
async function sync({full=false}={}){
  if(cfg.locked)return;
  if(!cfg.url||!cfg.token)return setStatus('off');
  if(syncing){again=true;return}
  if(!navigator.onLine)return setStatus('offline');
  syncing=true;setStatus('syncing');
  full=full||!cfg.cursor||Date.now()-cfg.lastFull>6*3600e3;
  try{
    const dirty=[...all.values()].filter(c=>c.dirty);
    const sent=new Map(dirty.map(c=>[c.id,c.updatedAt]));
    const j=await post({token:cfg.token,cursor:full?0:cfg.cursor,changes:dirty.map(wire),tagLib});
    const changed=[],events=[];
    for(const[id,u]of sent){const c=all.get(id);if(c&&c.updatedAt===u&&c.dirty){c.dirty=false;changed.push(c)}}
    const seen=new Set();
    for(const r of j.changes||[]){
      const inc=clean({...r,dirty:false});seen.add(inc.id);
      const loc=all.get(inc.id);
      if(loc&&loc.dirty&&loc.updatedAt>inc.updatedAt)continue;
      if(loc&&!loc.dirty&&JSON.stringify(wire(loc))===JSON.stringify(wire(inc)))continue;
      if(!sent.has(inc.id)){const k=!loc||loc.deleted?(inc.deleted?null:'added'):inc.deleted?'deleted':'edited';if(k)events.push([k,inc,diffLines(loc&&!loc.deleted?loc:null,inc.deleted?null:inc,disp(inc.deleted&&loc?loc:inc))])}
      all.set(inc.id,inc);changed.push(inc);
    }
    const removed=[];
    if(full&&Array.isArray(j.changes)){for(const c of [...all.values()])if(!c.dirty&&!seen.has(c.id)){all.delete(c.id);removed.push(c.id);if(!c.deleted)events.push(['deleted',c,diffLines(c,null,disp(c))])}}
    if(changed.length)await idb.put(changed);
    if(removed.length)await idb.del(removed);
    if(j.tagLib&&Array.isArray(j.tagLib.list)&&(Number(j.tagLib.updatedAt)||0)>tagLib.updatedAt){tagLib={list:tagList(j.tagLib.list,200),updatedAt:Number(j.tagLib.updatedAt)};dataVer++;await idb.set('taglib',tagLib);scheduleRender()}
    if(events.length)dataVer++;
    if(events.length>8)await logAdd('synced',`Received ${events.length} changes from your other phones or the Sheet`,'sync',events.flatMap(e=>e[2]));
    else for(const[k,c,d]of events)await logAdd(k,`${k==='added'?'Added':k==='deleted'?'Deleted':'Edited'} ${disp(c)}`,'sync',d.map(x=>[x[0],x[1],x[2].replace(disp(c)+' · ','')]));
    cfg.cursor=j.cursor||0;cfg.lastSync=Date.now();if(full)cfg.lastFull=Date.now();
    await idb.set('sync',cfg);
    failCount=0;setStatus('idle');
    if(changed.length||removed.length||events.length){dataVer++;scheduleRender()}
  }catch(e){
    if(e.code==='locked'||e.code==='revoked'){syncing=false;await lockdown(e.code==='locked'?'':'This phone was signed out of sync (an SOS lock happened). Contacts were wiped from this phone. Unlock to download them again.');return}
    failCount++;

async function importList(items){

  for(const x of items){const c=clean({...x,id:uid()},{format:true});if(!c.name&&!c.phones.length&&!c.emails.length)continue;
    const ck=[...c.phones.map(p=>phoneKey(p.value)).filter(Boolean).map(k=>'p'+k),...c.emails.map(e=>'e'+e.value.toLowerCase())];
    const hit=ck.map(k=>owner.get(k)).find(Boolean);
    if(hit&&ck.every(k=>owner.has(k))){ // already saved: merge, the contact with more detail wins
      const base=upd.get(hit)||add.find(a=>a.id===hit)||all.get(hit);if(!base)continue;
      const{merged:m}=mergeInto([base,{...c,createdAt:Date.now()}]);m.id=base.id;m.createdAt=base.createdAt;

    ck.forEach(k=>{if(!owner.has(k))owner.set(k,c.id)});add.push(c)}
  const changedUpd=[...upd.values()].filter(m=>{const o=all.get(m.id);return JSON.stringify(wire(clean(m)))!==JSON.stringify(wire(o))});
  if(add.length||changedUpd.length){await saveMany([...add,...changedUpd]);await logAdd('added',`Imported ${add.length} ${add.length===1?'contact':'contacts'}${merged?` · ${merged} merged into existing`:''}`)}
  const g=dupGroups().length;
  toast(`${add.length} imported${merged?` · ${merged} merged into existing`:''}${g?` · ${g} to review`:''}`,g?'Review':'',g?openDuplicates:null);haptic([8,30,8]);
}
$('#vcfFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>20*1024*1024){toast('That file is too large (20 MB max)');return}try{const l=parseVCF(await f.text());if(!l.length){toast('No contacts found in that file');return}await importList(l)}catch{toast('Could not read that file')}});
function qp(s,charset){const bytes=[];for(let i=0;i<s.length;i++){if(s[i]==='='&&/^[0-9A-F]{2}$/i.test(s.substr(i+1,2))){bytes.push(parseInt(s.substr(i+1,2),16));i+=2}else bytes.push(s.charCodeAt(i)&255)}try{return new TextDecoder(charset||'utf-8').decode(new Uint8Array(bytes))}catch{return new TextDecoder().decode(new Uint8Array(bytes))}}
const unesc=s=>s.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
function splitV(s,ch){const out=[];let cur='';for(let i=0;i<s.length;i++){if(s[i]==='\\'&&i+1<s.length){cur+=s[i]+s[i+1];i++}else if(s[i]===ch){out.push(cur);cur=''}else cur+=s[i]}out.push(cur);return out}
function parseVCF(text){
  const raw=text.replace(/\r\n?/g,'\n').split('\n'),lines=[];
  for(const l of raw){const last=lines.length-1;if(/^[ \t]/.test(l)&&last>=0)lines[last]+=l.slice(1);else if(last>=0&&/=$/.test(lines[last])&&/QUOTED-PRINTABLE/i.test(lines[last].split(':')[0]))lines[last]=lines[last].slice(0,-1)+l;else lines.push(l)}
  const out=[];let cur=null;
  for(const line of lines){
    const ix=line.indexOf(':');if(ix<0)continue;
    const left=line.slice(0,ix),value=line.slice(ix+1),parts=left.split(';'),prop=parts[0].split('.').pop().toUpperCase(),params=parts.slice(1).join(';').toUpperCase();
    if(prop==='BEGIN'&&/VCARD/i.test(value)){cur={name:'',n:'',phones:[],emails:[],tags:[],notes:''};continue}
    if(!cur)continue;
    if(prop==='END'){if(!cur.name&&cur.n)cur.name=cur.n;out.push(cur);cur=null;continue}
    let v=value;if(/QUOTED-PRINTABLE/.test(params))v=qp(v,(params.match(/CHARSET=([\w-]+)/)||[])[1]);
    const types=(params.match(/(?:TYPE=)?([A-Z-]+)/g)||[]).join(',');
    const lab=/CELL|MOBILE/.test(types)?'Mobile':/HOME/.test(types)?'Home':/WORK/.test(types)?'Work':'Other';
    if(prop==='FN')cur.name=unesc(v).trim();
    else if(prop==='N'){const p=splitV(v,';').map(x=>unesc(x).trim());cur.n=[p[3],p[1],p[2],p[0],p[4]].filter(Boolean).join(' ')}
    else if(prop==='TEL')cur.phones.push({label:lab,value:unesc(v).replace(/^tel:/i,'').trim()});
    else if(prop==='EMAIL')cur.emails.push({label:/WORK/.test(types)?'Work':'Personal',value:unesc(v).trim()});
    else if(prop==='NOTE')cur.notes=unesc(v).trim();
    else if(prop==='CATEGORIES')cur.tags.push(...splitV(v,',').map(x=>unesc(x).trim()).filter(Boolean));
  }
  return out;
}
const vesc=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
function toVCF(c){
  const w=(c.name||'').trim().split(/\s+/),family=w.length>1?w.pop():'',given=w.join(' ');
  const L=['BEGIN:VCARD','VERSION:3.0',`FN:${vesc(disp(c))}`,`N:${vesc(family)};${vesc(given)};;;`];
  for(const p of c.phones)L.push(`TEL;TYPE=${p.label==='Mobile'?'CELL':p.label==='Home'?'HOME':p.label==='Work'?'WORK':'VOICE'}:${vesc(p.value)}`);
  for(const e of c.emails)L.push(`EMAIL;TYPE=INTERNET${e.label==='Work'?',WORK':',HOME'}:${vesc(e.value)}`);
  if(c.notes)L.push(`NOTE:${vesc(c.notes)}`);
  if(c.tags.length)L.push(`CATEGORIES:${c.tags.map(vesc).join(',')}`);
  L.push('END:VCARD');return L.join('\r\n');
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportVCF(){const cs=live().sort((a,b)=>collator.compare(disp(a),disp(b)));if(!cs.length){toast('No contacts to export yet');return}download(`orbit-contacts-${new Date().toISOString().slice(0,10)}.vcf`,cs.map(toVCF).join('\r\n')+'\r\n','text/vcard');toast(`${cs.length} contacts exported`)}
async function shareContact(c){
  const name=disp(c),file=new File([toVCF(c)],name.replace(/[^\w\- ]+/g,'').trim()+'.vcf',{type:'text/vcard'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}if(navigator.share){await navigator.share({title:name,text:contactText(c)});return}}catch(e){if(e.name==='AbortError')return}
  const ok=await copyText(contactText(c));toast(ok?'Contact details copied':'Sharing is not available');
}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();return ok}}

/* ---------- toast ---------- */
let toastTimer=0,toastFn=null;
function toast(msg,action='',fn=null){const el=$('#toast');$('#toastText').textContent=msg;$('#toastAct').textContent=action;toastFn=fn;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),action?5500:3000)}
$('#toastAct').addEventListener('click',async()=>{const f=toastFn;toastFn=null;$('#toast').classList.remove('show');if(f)await f()});

/* ---------- add button ---------- */
$('#addBtn').addEventListener('click',()=>{if(selecting)endSelect();const t=q.trim();if(t&&!lastResults.length)act('new-from-q');else openEditor()});

/* ---------- desktop gate ---------- */
function gate(){
  const desk=matchMedia('(min-width: 900px) and (pointer: fine)').matches;
  let ok=false;try{ok=sessionStorage.getItem('orbit-preview')==='1'}catch{}
  if(desk)body.classList.add('desk');
  if(!desk||ok)return;
  $('#gate').hidden=false;$('#gateUrl').textContent=location.href.split('#')[0];
  $('#gatePreview').onclick=()=>{try{sessionStorage.setItem('orbit-preview','1')}catch{}$('#gate').hidden=true};
  $('#gateScript').onclick=copyScript;
}

/* ---------- start ---------- */
async function init(){
  gate();
  try{
    await openDB();
    const saved=await idb.all();for(const c of saved){const x=clean(c);all.set(x.id,x)}
    const s=await idb.get('sync');if(s)cfg={...cfg,...s};
    const tl=await idb.get('taglib');if(tl&&Array.isArray(tl.list))tagLib=tl;
    if(!(await idb.get('tagOrderV2'))){const pl=libPlain().map(t=>t.toUpperCase());if(pl[0]==='BT'&&pl[1]==='DB'&&pl[2]==='E31'){const others=tagLib.list.filter(t=>!['BT','DB','E31'].includes(t.toUpperCase()));tagLib={list:['BT','E31','DB',...others],updatedAt:Date.now()};await idb.set('taglib',tagLib)}await idb.set('tagOrderV2',1)}
    const lg=await idb.get('log');if(Array.isArray(lg))changeLog=lg;
    const di=await idb.get('dupIgnore');if(Array.isArray(di))dupIgnore=new Set(di);
    dataVer++;
  }catch(e){list.innerHTML='<div class="empty"><h2>Storage is blocked</h2><p>Allow site storage (leave private browsing) and reload. Nothing has been deleted.</p></div>';return}
  const m=location.hash.match(/connect=([\w-]+)/);
  if(m){history.replaceState(history.state,'',location.pathname+location.search);try{const o=JSON.parse(b64d(m[1]));if(o.u){render();await connect(o.u)}}catch{toast('That setup link is not valid')}}
  if(cfg.locked)$('#lockscr').hidden=false;
  setStatus(cfg.url&&cfg.token?(navigator.onLine?'idle':'offline'):'off');
  render();
  if(cfg.url&&cfg.token)queueSync(250);
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
init();
})();
